# Generates the "snake eating your contribution graph" animation.
# Put this file at .github/workflows/snake.yml in your TwistyRabbit114 repo.
# Then: repo Settings → Actions → General → Workflow permissions → "Read and write".
# Run it once by hand from the Actions tab; after that it refreshes daily.

name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 02:00 Cape Town time
  workflow_dispatch:       # lets you run it manually
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
